<style>
/* Layout: Berlin street-poster. Espresso hero with huge name, yellow TV tower and a cup standing on a yellow ticker band; sticky category bar; colourful illustrated cards with yellow price stickers. Single dark look on purpose. */
:root {
  --bg: #170E09;
  --band: #2A1509;
  --card: #26170F;
  --line: #3E2A1C;
  --fg: #F6EBDD;
  --muted: #BFA58E;
  --yellow: #FFC72C;
  --ink: #170E09;
  --red: #E4572E;
  --il-ink: #170E09;
  --il-cream: #F6EBDD;
  --il-coffee: #5A3420;
  --il-crema: #C98F57;
  --il-copper: #B8743A;
  --il-gold: #FFC72C;
  --il-steel: #B7C4CA;
  --il-glass: #E3F1F3;
  --il-water: #5BC0EB;
  --il-cola: #3B1E12;
  --il-sponge: #E4BC80;
  --il-pink: #F7D3CB;
  --il-red: #E4572E;
  --il-cin: #8A5230;
  --font-display: "Anton", "Noto Kufi Arabic", system-ui, sans-serif;
  --font-body: "DM Sans", "Noto Naskh Arabic", system-ui, sans-serif;
  --dir: -1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--band);
  z-index: 30;
}
.wrap {
  max-width: 680px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.disp {
  font-family: var(--font-display);
  font-weight: 800;
  font-synthesis: none;
  text-transform: uppercase;
}

/* hero */
.hero { background: radial-gradient(120% 80% at 85% 100%, #5E2C12 0%, var(--band) 62%); overflow: hidden; }
.hero .wrap { padding-block: 22px 0; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sign {
  background: var(--yellow);
  color: var(--ink);
  border-radius: 10px;
  padding: 4px 14px;
  font-size: 1.15rem;
  line-height: 1.5;
  letter-spacing: 0.08em;
  box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 2px var(--yellow);
  margin: 2px;
}
.langs { display: inline-flex; border: 1.5px solid var(--muted); border-radius: 999px; padding: 3px; gap: 2px; }
.langs button {
  font: inherit;
  font-family: var(--font-display);
  font-weight: 700;
  font-synthesis: none;
  font-size: 0.95rem;
  color: var(--fg);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 6px 15px;
  min-height: 40px;
  cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
.langs button:focus-visible, .chip:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.brand-block { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.brand-sub {
  color: var(--yellow);
  font-size: clamp(1.3rem, 6vw, 2rem);
  letter-spacing: 0.4em;
  line-height: 1.2;
}
.brand {
  margin: 0;
  font-size: clamp(4.4rem, 22vw, 8rem);
  line-height: 0.9;
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
}
html[lang="ku"] .brand, html[lang="ar"] .brand { font-weight: 900; line-height: 1.25; letter-spacing: 0; }
html[lang="ku"] .brand-sub, html[lang="ar"] .brand-sub { letter-spacing: 0; font-weight: 800; }
html[lang="ku"] .sign, html[lang="ar"] .sign { letter-spacing: 0; }
.scene { align-self: flex-end; width: clamp(180px, 56vw, 270px); height: auto; margin-top: -26px; display: block; }
.tower { fill: var(--yellow); }
.steam { fill: none; stroke: var(--il-cream); stroke-width: 6; stroke-linecap: round; opacity: 0.7; transform-box: fill-box; }
@media (prefers-reduced-motion: no-preference) {
  .steam { animation: rise 3.4s ease-in-out infinite; }
  .steam.b { animation-delay: 1.4s; }
}
@keyframes rise {
  0% { transform: translateY(10px); opacity: 0; }
  35% { opacity: 0.75; }
  100% { transform: translateY(-14px); opacity: 0; }
}

/* ticker */
.ticker { background: var(--yellow); color: var(--ink); overflow: hidden; }
.track { display: flex; width: max-content; padding-block: 10px; }
.group { display: flex; flex: 0 0 auto; }
.tick { display: inline-flex; align-items: center; gap: 18px; padding-inline-end: 18px; font-size: 1.2rem; line-height: 1.5; white-space: nowrap; }
.tick::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .track { animation: slide 30s linear infinite; }
}
@keyframes slide { to { transform: translateX(calc(var(--dir) * 50%)); } }

/* sticky category bar */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.nav .wrap::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 700;
  font-synthesis: none;
  text-transform: uppercase;
  font-size: 1rem;
  color: var(--fg);
  background: transparent;
  border: 1.5px solid var(--muted);
  border-radius: 999px;
  padding: 6px 18px;
  min-height: 40px;
  cursor: pointer;
}
.chip[aria-current="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }

/* menu */
.menu .wrap { padding-block: 6px 0; }
section { padding-block: 34px 0; scroll-margin-top: calc(56px + env(safe-area-inset-top, 0px)); }
.sec-head { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
.sec-head h2 { margin: 0; font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1.15; text-wrap: balance; }
html[lang="ku"] .sec-head h2, html[lang="ar"] .sec-head h2 { line-height: 1.4; }
.sec-head::after { content: ""; width: 72px; height: 8px; border-radius: 4px; background: var(--yellow); }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 28px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.art {
  background: radial-gradient(circle at 72% 28%, rgba(255, 255, 255, 0.22) 0 24%, transparent 25%), var(--tile);
  display: grid;
  place-items: center;
  aspect-ratio: 1 / 0.82;
}
.art svg { width: 74%; max-height: 86%; height: auto; }
.info { padding: 12px 14px 16px; min-width: 0; }
.name { margin: 0; font-size: 1.35rem; line-height: 1.3; overflow-wrap: anywhere; }
html[lang="ku"] .name, html[lang="ar"] .name { line-height: 1.55; font-size: 1.25rem; }
.sticker {
  position: absolute;
  top: 10px;
  inset-inline-end: 10px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: var(--yellow);
  color: var(--ink);
  border: 3px solid var(--bg);
  transform: rotate(-9deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.05;
  text-align: center;
}
.num { font-family: var(--font-display); font-weight: 800; font-synthesis: none; font-size: 1.4rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.unit { font-weight: 700; font-size: 0.68rem; letter-spacing: 0.06em; }
html[lang="ku"] .unit, html[lang="ar"] .unit { letter-spacing: 0; }

.card.feature { display: grid; grid-column: 1 / -1; grid-template-columns: minmax(130px, 42%) minmax(0, 1fr); align-items: stretch; }
.feature .art { aspect-ratio: auto; min-height: 150px; }
.feature .art svg { width: 70%; }
.feature .info { align-self: center; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.feature .name { font-size: 1.8rem; }
html[lang="ku"] .feature .name, html[lang="ar"] .feature .name { font-size: 1.6rem; }
.feature .sticker { position: static; width: auto; height: auto; border-radius: 999px; transform: none; flex-direction: row; gap: 6px; padding: 6px 16px; border: 0; align-items: baseline; }
.feature .num { font-size: 1.6rem; }

/* footer */
.foot { margin-top: 44px; background: var(--yellow); color: var(--ink); }
.foot .wrap { padding-block: 26px 40px; display: flex; flex-direction: column; gap: 6px; }
.foot-name { font-size: 2.2rem; line-height: 1.3; }
.foot p { margin: 0; font-weight: 500; }

/* illustration paint */
.s { stroke: var(--il-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.n { fill: none; }
.f-cream { fill: var(--il-cream); }
.f-coffee { fill: var(--il-coffee); }
.f-crema { fill: var(--il-crema); }
.f-copper { fill: var(--il-copper); }
.f-gold { fill: var(--il-gold); }
.f-steel { fill: var(--il-steel); }
.f-glass { fill: var(--il-glass); fill-opacity: 0.7; }
.f-water { fill: var(--il-water); }
.f-cola { fill: var(--il-cola); }
.f-sponge { fill: var(--il-sponge); }
.f-pink { fill: var(--il-pink); }
.f-red { fill: var(--il-red); }
.f-ink { fill: var(--il-ink); }
.f-ice { fill: var(--il-cream); fill-opacity: 0.65; }
.s-cin { stroke: var(--il-cin); stroke-width: 4; stroke-linecap: round; fill: none; }
.s-red { stroke: var(--il-red); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.shine { stroke: var(--il-cream); stroke-width: 2; stroke-linecap: round; fill: none; opacity: 0.6; }
.soft { opacity: 0.45; }
</style>

    var use = document.createElementNS(SVGNS, "use");
    use.setAttribute("href", "#i-" + id);
    svg.appendChild(use);
    return svg;
  }

  var observer = null;

  function render(lang) {
    var t = T[lang];
    var root = document.documentElement;
    root.setAttribute("lang", lang);
    root.setAttribute("dir", t.dir);
    root.style.setProperty("--dir", t.dir === "rtl" ? "1" : "-1");
    document.title = t.title;

    document.getElementById("city").textContent = t.city;
    document.getElementById("brand-sub").textContent = t.sub;
    document.getElementById("brand").textContent = t.main;
    document.getElementById("foot-name").textContent = t.title;
    document.getElementById("foot-city").textContent = t.city;
    document.getElementById("note").textContent = t.note;

    ["ku", "ar", "en"].forEach(function (l) {
      document.getElementById("btn-" + l).setAttribute("aria-pressed", l === lang ? "true" : "false");
    });

    /* ticker */
    var track = document.getElementById("track");
    track.textContent = "";
    for (var g = 0; g < 2; g++) {
      var group = el("div", "group");
      for (var rep = 0; rep < 2; rep++) {
        group.appendChild(el("span", "tick disp", TICKERS[lang]));
      }
      track.appendChild(group);
    }

    var nav = document.getElementById("nav-inner");
    var menu = document.getElementById("menu");
    nav.textContent = "";
    menu.textContent = "";
    if (observer) observer.disconnect();

    MENU.forEach(function (sec, idx) {
      var chip = el("button", "chip", sec.title[lang]);
      chip.type = "button";
      chip.setAttribute("data-target", "sec-" + idx);
      if (idx === 0) chip.setAttribute("aria-current", "true");
      nav.appendChild(chip);

      var s = el("section");
      s.id = "sec-" + idx;
      var head = el("div", "sec-head");
      head.appendChild(el("h2", "disp", sec.title[lang]));
      s.appendChild(head);

      var ul = el("ul", "grid");
      var odd = sec.items.length % 2 === 1;
      sec.items.forEach(function (it, k) {
        var li = el("li", "card" + (odd && k === 0 ? " feature" : ""));
        li.style.setProperty("--tile", it.c);
        var art = el("div", "art");
        art.appendChild(icon(it.i));
        li.appendChild(art);
        var info = el("div", "info");
        info.appendChild(el("h3", "name disp", it.n[lang]));
        var st = el("div", "sticker");
        st.appendChild(el("span", "num", fmt(it.p, t.digits)));
        st.appendChild(el("span", "unit", t.unit));
        info.appendChild(st);
        li.appendChild(info);
        ul.appendChild(li);
      });
      s.appendChild(ul);
      menu.appendChild(s);
    });

    if ("IntersectionObserver" in window) {
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var id = en.target.id;
          nav.querySelectorAll(".chip").forEach(function (c) {
            if (c.getAttribute("data-target") === id) c.setAttribute("aria-current", "true");
            else c.removeAttribute("aria-current");
          });
        });
      }, { rootMargin: "-30% 0px -60% 0px" });
      menu.querySelectorAll("section").forEach(function (s) { observer.observe(s); });
    }
  }

  var lang = "ku";
  try {
    var saved = localStorage.getItem("cafe-berlin-lang");
    if (saved && T[saved]) lang = saved;
  } catch (e) {}
  render(lang);

  document.querySelector(".langs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-lang]");
    if (!b) return;
    lang = b.getAttribute("data-lang");
    render(lang);
    try { localStorage.setItem("cafe-berlin-lang", lang); } catch (e) {}
  });

  document.getElementById("nav-inner").addEventListener("click", function (ev) {
    var c = ev.target.closest(".chip");
    if (!c) return;
    var target = document.getElementById(c.getAttribute("data-target"));
    if (target) target.scrollIntoView({ block: "start" });
  });
})();
</script>

</body></html>
